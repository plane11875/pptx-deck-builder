    <text x="682" y="392" font-family="Consolas, Menlo, monospace" font-size="13" fill="#38BDF8">svg_quality_checker.py</text>
    <line x1="682" y1="418" x2="873" y2="418" stroke="#1E2B44" stroke-width="1"/>
    <text x="682" y="452" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17" fill="#7C8CA6">校验 SVG 契约,<tspan x="682" dy="28">不合规就不让编译</tspan></text>
    <rect x="935" y="236" width="255" height="300" fill="#121C2F" stroke="#22304A" stroke-width="1" rx="18"/>
    <circle cx="975" cy="288" r="22" fill="url(#accentV)"/>
    <text x="975" y="296" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#0B1220" font-weight="700" text-anchor="middle">04</text>
    <text x="967" y="352" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22" fill="#F8FAFC" font-weight="700">编译成 PPTX</text>
    <text x="967" y="392" font-family="Consolas, Menlo, monospace" font-size="13" fill="#38BDF8">svg_to_pptx.py</text>
    <line x1="967" y1="418" x2="1158" y2="418" stroke="#1E2B44" stroke-width="1"/>
    <text x="967" y="452" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17" fill="#7C8CA6">SVG → DrawingML,<tspan x="967" dy="28">输出原生可编辑对象</tspan></text>
  </g>
  <g id="s2-note" data-pptx-bounds="80 566 1120 68">
    <rect x="80" y="566" width="1120" height="68" fill="#0F1A2E" stroke="#1E3A52" stroke-width="1" rx="18"/>
    <text x="108" y="608" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#CBD5E1">整条链路都在 Codespace 里跑完:不需要模型 API Key,也不需要图片生成接口。</text>
  </g>
