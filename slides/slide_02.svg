    <text x="112" y="452" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17" fill="#7C8CA6">pptx 项目的目录结构、<tspan x="112" dy="28">画布与执行日志</tspan></text>
    <rect x="365" y="236" width="255" height="300" fill="#121C2F" stroke="#22304A" stroke-width="1" rx="18"/>
    <circle cx="405" cy="288" r="22" fill="url(#accentV)"/>
    <text x="405" y="296" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#0B1220" font-weight="700" text-anchor="middle">02</text>
    <text x="397" y="352" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22" fill="#F8FAFC" font-weight="700">生成幻灯片源</text>
    <text x="397" y="392" font-family="Consolas, Menlo, monospace" font-size="13" fill="#38BDF8">builder/make_slides.py</text>
    <line x1="397" y1="418" x2="588" y2="418" stroke="#1E2B44" stroke-width="1"/>
    <text x="397" y="452" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17" fill="#7C8CA6">8 个 SVG 页面,<tspan x="397" dy="28">就是这份稿子的源文件</tspan></text>
    <rect x="650" y="236" width="255" height="300" fill="#121C2F" stroke="#22304A" stroke-width="1" rx="18"/>
    <circle cx="690" cy="288" r="22" fill="url(#accentV)"/>
    <text x="690" y="296" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#0B1220" font-weight="700" text-anchor="middle">03</text>
