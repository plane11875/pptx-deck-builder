    <text x="80" y="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#7C8CA6">PPT Master v6.7.0 × python-pptx · 在 GitHub Codespace 中自动生成</text>
    <text x="1200" y="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#7C8CA6" text-anchor="end">02 / 08</text>
  </g>
  <g id="s2-steps" data-pptx-bounds="80 236 1110 300">
    <rect x="80" y="236" width="255" height="300" fill="#121C2F" stroke="#22304A" stroke-width="1" rx="18"/>
    <circle cx="120" cy="288" r="22" fill="url(#accentV)"/>
    <text x="120" y="296" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#0B1220" font-weight="700" text-anchor="middle">01</text>
    <text x="112" y="352" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22" fill="#F8FAFC" font-weight="700">初始化项目</text>
    <text x="112" y="392" font-family="Consolas, Menlo, monospace" font-size="13" fill="#38BDF8">project_manager.py init</text>
