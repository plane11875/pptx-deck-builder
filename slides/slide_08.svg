      <stop offset="0" stop-color="#101B31"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <g id="page-frame" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720">
    <rect x="0" y="0" width="1280" height="720" fill="url(#deckBg)"/>
    <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
  </g>
  <g id="page-chrome" data-pptx-role="chrome" data-pptx-bounds="80 76 1120 613">
    <rect x="80" y="76" width="44" height="4" fill="url(#accent)" rx="2"/>
