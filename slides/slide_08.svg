    <text x="80" y="588" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17" fill="#7C8CA6">成品在 output/,预览图在 output/preview/,幻灯片源在 slides/。</text>
    <circle cx="1176" cy="566" r="24" fill="url(#accentV)"/>
    <text x="1176" y="574" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22" fill="#0B1220" font-weight="700" text-anchor="middle">→</text>
