    <line x1="80" y1="188" x2="1200" y2="188" stroke="#22304A" stroke-width="1"/>
    <line x1="80" y1="660" x2="1200" y2="660" stroke="#1E2B44" stroke-width="1"/>
    <text x="80" y="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#7C8CA6">PPT Master v6.7.0 × python-pptx · 在 GitHub Codespace 中自动生成</text>
    <text x="1200" y="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#7C8CA6" text-anchor="end">08 / 08</text>
  </g>
  <g id="s8-code" data-pptx-bounds="80 228 1120 268">
    <rect x="80" y="228" width="1120" height="268" fill="#0A1120" stroke="#1E3A52" stroke-width="1" rx="18"/>
    <rect x="108" y="262" width="40" height="4" fill="url(#accent)" rx="2"/>
    <text x="108" y="296" font-family="Consolas, Menlo, monospace" font-size="14" fill="#38BDF8" letter-spacing="3">bash</text>
    <text x="108" y="342" font-family="Consolas, Menlo, monospace" font-size="16" fill="#CBD5E1">git clone https://github.com/hugohe3/ppt-master<tspan x="108" dy="32">pip install python-pptx XlsxWriter skia-pathops uharfbuzz</tspan><tspan x="108" dy="32">python builder/make_slides.py</tspan><tspan x="108" dy="32">python scripts/svg_quality_checker.py &lt;project&gt;/svg_output --quick-generate</tspan><tspan x="108" dy="32">python scripts/svg_to_pptx.py &lt;project&gt; --quick-generate -o output/deck.pptx</tspan></text>
  </g>
  <g id="s8-links" data-pptx-bounds="80 526 1120 69">
